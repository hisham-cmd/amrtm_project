<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>إنشاء حساب | آمر تم</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--pri:#1A237E;--pri2:#283593;--pri3:#1565C0;--bg:#F4F6FB;--sur:#fff;--b1:rgba(26,35,126,.1);--b2:rgba(26,35,126,.28);--t1:#0D1257;--t2:#3A4490;--t3:#7A82B8;--pd:rgba(26,35,126,.08);--pd2:rgba(26,35,126,.15);--sh:rgba(26,35,126,.08);--sh2:rgba(26,35,126,.18);--hf:#1A237E;--ht:#1565C0;}
html,body{min-height:100vh;display:flex;flex-direction:column;}
body.ar{font-family:'Cairo',sans-serif;direction:rtl;}
body.en{font-family:'Inter',sans-serif;direction:ltr;}
.bg{position:fixed;inset:0;z-index:0;background:linear-gradient(135deg,var(--hf) 0%,var(--ht) 100%);}
.bg::before{content:'';position:absolute;top:-80px;right:-80px;width:350px;height:350px;border-radius:50%;background:rgba(255,255,255,.04);}
.wrap{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1.2rem;}
.lang-tog{display:flex;gap:6px;margin-bottom:1.3rem;}
.ltb{padding:5px 14px;border-radius:8px;font-size:11.5px;font-weight:700;cursor:pointer;color:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.2);background:transparent;transition:all .2s;font-family:inherit;}
.ltb.on{background:rgba(255,255,255,.2);color:#fff;}
.logo-area{display:flex;flex-direction:column;align-items:center;margin-bottom:1.6rem;}
.logo-ico{width:64px;height:64px;border-radius:18px;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.28);display:flex;align-items:center;justify-content:center;margin-bottom:.8rem;overflow:hidden;}
.logo-ico img{width:54px;height:54px;object-fit:contain;}
.logo-nm{font-size:22px;font-weight:900;color:#fff;}
.logo-sb{font-size:11.5px;color:rgba(255,255,255,.65);margin-top:3px;}
.card{background:var(--sur);border-radius:22px;width:100%;max-width:500px;overflow:hidden;box-shadow:0 24px 64px rgba(0,0,0,.2);}
.card-hd{padding:1.5rem 2rem 1.2rem;border-bottom:1px solid var(--b1);}
.c-ttl{font-size:17px;font-weight:800;color:var(--t1);}
.c-sub{font-size:12.5px;color:var(--t3);margin-top:4px;}
.card-bd{padding:1.5rem 2rem;}
.alert{display:none;padding:.8rem 1rem;border-radius:10px;margin-bottom:1rem;font-size:13px;font-weight:600;align-items:center;gap:7px;}
.alert.show{display:flex;}
.alert.ok{background:rgba(27,94,32,.1);color:#1B5E20;border:1px solid rgba(27,94,32,.2);}
.alert.err{background:rgba(198,40,40,.08);color:#C62828;border:1px solid rgba(198,40,40,.2);}
/* method toggle */
.method-tog{display:flex;gap:4px;margin-bottom:1.2rem;padding:3px;border-radius:10px;background:var(--bg2,#EBEEf8);border:1px solid var(--b1);}
.mt-btn{flex:1;padding:8px;border-radius:8px;text-align:center;font-size:13px;font-weight:700;cursor:pointer;color:var(--t3);transition:all .2s;}
.mt-btn.on{background:var(--pri);color:#fff;box-shadow:0 2px 8px var(--sh);}
/* form row */
.row{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}
.fld{margin-bottom:1.1rem;}
.fld label{display:block;font-size:12.5px;font-weight:700;color:var(--t1);margin-bottom:5px;}
.req{color:#C62828;margin-right:3px;}
body.en .req{margin-right:0;margin-left:3px;}
.inp-w{position:relative;}
.inp-w input{width:100%;height:46px;padding:0 13px 0 42px;border-radius:11px;border:1.5px solid var(--b1);background:var(--sur);color:var(--t1);font-family:inherit;font-size:13.5px;outline:none;transition:all .2s;box-shadow:0 1px 4px var(--sh);}
body.ar .inp-w input{padding:0 42px 0 13px;}
.inp-w input:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pd);}
.inp-w input.err{border-color:#C62828;}
.i-ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--t3);font-size:17px;pointer-events:none;}
body.ar .i-ico{left:auto;right:13px;}
.eye-btn{position:absolute;right:13px;top:50%;transform:translateY(-50%);color:var(--t3);font-size:16px;cursor:pointer;}
body.ar .eye-btn{right:auto;left:13px;}
.ferr{font-size:11px;color:#C62828;margin-top:4px;display:none;align-items:center;gap:3px;}
.ferr.show{display:flex;}
/* terms */
.terms{display:flex;align-items:flex-start;gap:8px;margin-bottom:1.2rem;font-size:12.5px;color:var(--t2);line-height:1.7;cursor:pointer;}
.terms input{width:16px;height:16px;margin-top:2px;flex-shrink:0;accent-color:var(--pri);}
.terms a{color:var(--pri);font-weight:700;text-decoration:none;}
/* submit */
.sub-btn{width:100%;height:50px;background:linear-gradient(135deg,var(--hf),var(--ht));color:#fff;font-family:inherit;font-size:15px;font-weight:800;border:none;border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 5px 18px var(--sh2);transition:all .25s;}
.sub-btn:hover{transform:translateY(-2px);}
.sub-btn.ld{opacity:.75;pointer-events:none;}
.spin{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;display:none;}
.sub-btn.ld .spin{display:block;}
.sub-btn.ld .btxt{display:none;}
@keyframes sp{to{transform:rotate(360deg)}}
.login-link{text-align:center;margin-top:.9rem;font-size:13px;color:var(--t3);}
.login-link a{color:var(--pri);font-weight:700;text-decoration:none;}
.back-link{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:.9rem;font-size:13px;color:var(--t3);text-decoration:none;transition:color .2s;}
.back-link:hover{color:var(--pri);}
@media(max-width:480px){.card{border-radius:18px;}.card-bd,.card-hd{padding:1.2rem 1.4rem;}.row{grid-template-columns:1fr;}}
</style>
</head>

  </div>

      <div class="fld" id="fld-email"><label><span class="req">*</span><span id="lbl-em">البريد الإلكتروني</span></label><div class="inp-w"><i class="ti ti-mail i-ico"></i><input type="email" id="f-em" placeholder="example@email.com"/></div><div class="ferr" id="err-em"><i class="ti ti-alert-circle"></i><span id="err-em-t">بريد غير صحيح</span></div></div>
      <div class="fld" id="fld-phone" style="display:none;"><label><span class="req">*</span><span id="lbl-ph">رقم الهاتف</span></label><div class="inp-w"><i class="ti ti-phone i-ico"></i><input type="tel" id="f-ph" placeholder="05xxxxxxxx"/></div><div class="ferr" id="err-ph"><i class="ti ti-alert-circle"></i><span id="err-ph-t">رقم غير صحيح</span></div></div>
      <!-- Password row -->
      <div class="row">
        <div class="fld"><label><span class="req">*</span><span id="lbl-ps">كلمة المرور</span></label><div class="inp-w"><i class="ti ti-lock i-ico"></i><input type="password" id="f-ps" placeholder="••••••••"/><span class="eye-btn" onclick="tog('f-ps','e1')"><i id="e1" class="ti ti-eye"></i></span></div><div class="ferr" id="err-ps"><i class="ti ti-alert-circle"></i><span id="err-ps-t">8 أحرف على الأقل</span></div></div>
        <div class="fld"><label><span class="req">*</span><span id="lbl-pc">تأكيد كلمة المرور</span></label><div class="inp-w"><i class="ti ti-lock i-ico"></i><input type="password" id="f-pc" placeholder="••••••••"/><span class="eye-btn" onclick="tog('f-pc','e2')"><i id="e2" class="ti ti-eye"></i></span></div><div class="ferr" id="err-pc"><i class="ti ti-alert-circle"></i><span id="err-pc-t">كلمتا المرور غير متطابقتين</span></div></div>
      </div>
      <!-- Terms -->
      <div class="terms"><input type="checkbox" id="terms-cb"/><label for="terms-cb"><span id="terms-txt">أوافق على </span><a href="#" id="terms-a">شروط الاستخدام وسياسة الخصوصية</a></label></div>
      <button class="sub-btn" id="sub-btn" onclick="doReg()">
        <span class="btxt" id="btn-txt"><i class="ti ti-user-plus"></i> إنشاء الحساب</span>
        <div class="spin"></div>
      </button>
      <div class="login-link" id="login-link">لديك حساب بالفعل؟ <a href="amr_login.html" id="login-a">تسجيل الدخول</a></div>
      <a class="back-link" href="index.html"><i class="ti ti-arrow-right" id="back-ico"></i><span id="back-lbl">العودة للموقع الرئيسي</span></a>
    </div>
  </div>
</div>
<script src="amrtm-api.js"></script>
<script>
const T={
  ar:{nm:'آمر تم',sb:'لقطاع الأعمال',ttl:'إنشاء حساب جديد',sub:'انضم إلى منصة آمر تم وابدأ طلب خدماتك',lblNm:'الاسم الكامل',mtEm:'بريد إلكتروني',mtPh:'رقم هاتف',lblEm:'البريد الإلكتروني',lblPh:'رقم الهاتف',lblPs:'كلمة المرور',lblPc:'تأكيد كلمة المرور',terms:'أوافق على ',termsA:'شروط الاستخدام وسياسة الخصوصية',btnTxt:'إنشاء الحساب',errNm:'مطلوب',errEm:'بريد غير صحيح',errPh:'رقم غير صحيح',errPs:'8 أحرف على الأقل',errPc:'كلمتا المرور غير متطابقتين',errTerms:'يجب الموافقة على الشروط',loginTxt:'لديك حساب بالفعل؟ ',loginA:'تسجيل الدخول',back:'العودة للموقع الرئيسي',success:'تم إنشاء حسابك بنجاح! جاري التحويل...'},
  en:{nm:'Amrtm',sb:'For the Business Sector',ttl:'Create New Account',sub:'Join Amrtm Platform and start requesting services',lblNm:'Full Name',mtEm:'Email',mtPh:'Phone Number',lblEm:'Email Address',lblPh:'Phone Number',lblPs:'Password',lblPc:'Confirm Password',terms:'I agree to the ',termsA:'Terms of Use and Privacy Policy',btnTxt:'Create Account',errNm:'Required',errEm:'Invalid email',errPh:'Invalid phone',errPs:'At least 8 characters',errPc:'Passwords do not match',errTerms:'You must agree to the terms',loginTxt:'Already have an account? ',loginA:'Sign In',back:'Back to Main Site',success:'Account created successfully! Redirecting...'},
};
let lang=localStorage.getItem('amrtm_lang')||'ar';
let method='email';

function setLang(l){
  lang=l;localStorage.setItem('amrtm_lang',l);
  document.documentElement.setAttribute('lang',l);document.documentElement.setAttribute('dir',l==='ar'?'rtl':'ltr');
  document.body.className=l;
  document.getElementById('ltb-ar').classList.toggle('on',l==='ar');
  document.getElementById('ltb-en').classList.toggle('on',l==='en');
  applyT();
}
function applyT(){
  const t=T[lang];
  const s=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=v;};
  s('logo-nm',t.nm);s('logo-sb',t.sb);s('c-ttl',t.ttl);s('c-sub',t.sub);
  s('lbl-nm',t.lblNm);s('mt-em-l',t.mtEm);s('mt-ph-l',t.mtPh);
  s('lbl-em',t.lblEm);s('lbl-ph',t.lblPh);s('lbl-ps',t.lblPs);s('lbl-pc',t.lblPc);
  document.getElementById('terms-txt').textContent=t.terms;
  document.getElementById('terms-a').textContent=t.termsA;
  document.getElementById('btn-txt').innerHTML=`<i class="ti ti-user-plus"></i> ${t.btnTxt}`;
  s('err-nm-t',t.errNm);s('err-em-t',t.errEm);s('err-ph-t',t.errPh);s('err-ps-t',t.errPs);s('err-pc-t',t.errPc);
  document.getElementById('login-link').innerHTML=t.loginTxt+`<a href="amr_login.html">${t.loginA}</a>`;
  s('back-lbl',t.back);
  document.getElementById('back-ico').className='ti '+(l==='ar'?'ti-arrow-right':'ti-arrow-left');
}
function setMethod(m){
  method=m;
  document.getElementById('mt-em').classList.toggle('on',m==='email');
  document.getElementById('mt-ph').classList.toggle('on',m==='phone');
  document.getElementById('fld-email').style.display=m==='email'?'block':'none';
  document.getElementById('fld-phone').style.display=m==='phone'?'block':'none';
}
function tog(fId,iId){
  const inp=document.getElementById(fId),ico=document.getElementById(iId);
  if(inp.type==='password'){inp.type='text';ico.className='ti ti-eye-off';}
  else{inp.type='password';ico.className='ti ti-eye';}
}
function showAlert(type,msg){
  const el=document.getElementById('alert');
  el.className='alert show '+(type==='ok'?'ok':'err');
  document.getElementById('alert-ico').className='ti '+(type==='ok'?'ti-circle-check':'ti-alert-circle');
  document.getElementById('alert-txt').textContent=msg;
}
function clearErrs(){document.querySelectorAll('.ferr').forEach(e=>e.classList.remove('show'));document.querySelectorAll('.inp-w input').forEach(i=>i.classList.remove('err'));document.getElementById('alert').className='alert';}
function shErr(fId,eId){document.getElementById(fId).classList.add('err');document.getElementById(eId).classList.add('show');}

async function doReg(){
  clearErrs();
  const t=T[lang];let ok=true;
  const name=document.getElementById('f-nm').value.trim();
  const em=document.getElementById('f-em').value.trim();
  const ph=document.getElementById('f-ph').value.trim();
  const ps=document.getElementById('f-ps').value;
  const pc=document.getElementById('f-pc').value;
  const terms=document.getElementById('terms-cb').checked;

  if(!name){shErr('f-nm','err-nm');ok=false;}
  if(method==='email'&&(!em||!em.includes('@'))){shErr('f-em','err-em');ok=false;}
  if(method==='phone'&&(!ph||ph.length<9)){shErr('f-ph','err-ph');ok=false;}
  if(!ps||ps.length<8){shErr('f-ps','err-ps');ok=false;}
  if(ps!==pc){shErr('f-pc','err-pc');ok=false;}
  if(!terms){showAlert('err',t.errTerms);ok=false;}
  if(!ok)return;

  const btn=document.getElementById('sub-btn');btn.classList.add('ld');

  try{
    if(typeof Auth!=='undefined'){
      await Auth.register(name,method==='email'?em:null,method==='phone'?ph:null,ps);
    }else{
      await new Promise(r=>setTimeout(r,1500));
      const u={name,email:em||null,phone:ph||null,role:'user',balance:0};
      localStorage.setItem('amrtm_user',JSON.stringify(u));
      localStorage.setItem('amrtm_token','demo_'+Date.now());
    }
    btn.classList.remove('ld');
    showAlert('ok',t.success);
    setTimeout(()=>window.location.href='index.html',1500);
  }catch(e){
    btn.classList.remove('ld');
    showAlert('err',e?.data?.message||'حدث خطأ، حاول مرة أخرى');
  }
}
document.addEventListener('keydown',e=>{if(e.key==='Enter')doReg();});
setLang(lang);
</script>
</body>
</html>
